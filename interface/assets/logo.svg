<svg xmlns="http://www.w3.org/2000/svg" width="220" height="64" viewBox="0 0 220 64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon circle -->
  <circle cx="32" cy="32" r="28" fill="url(#g1)" filter="url(#glow)" opacity="0.95"/>
  <!-- Siren / pulse rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Alert symbol -->
  <text x="32" y="40" font-family="Segoe UI, Arial" font-size="22" font-weight="800"
        fill="#ffffff" text-anchor="middle" filter="url(#glow)">🚨</text>

  <!-- Text block -->
  <g transform="translate(70, 10)">
    <text x="0" y="22" font-family="Segoe UI, Inter, Arial" font-size="17" font-weight="800"
          fill="url(#g2)" letter-spacing="-0.3">Emergency Response</text>
    <text x="0" y="40" font-family="Segoe UI, Inter, Arial" font-size="10.5" font-weight="500"
          fill="#8b949e" letter-spacing="0.5">Road Incident Detection</text>
    <!-- Accent line -->
    <rect x="0" y="46" width="150" height="1.5" rx="1" fill="url(#g1)" opacity="0.6"/>
  </g>
</svg>
