[pytest]
testpaths = tests
addopts =
    --cov=interface/core
    --cov-report=term-missing
    --cov-report=html:htmlcov
    -v
    --tb=short

# Markers used in the suite
markers =
    integration: marks tests that require model.keras and TensorFlow (deselect with -m "not integration")
    ui: marks Streamlit AppTest UI tests (deselect with -m "not ui")

# Ignore deprecation warnings from third-party libs
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
